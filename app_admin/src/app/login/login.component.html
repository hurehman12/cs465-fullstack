<div class="container mt-4">

  <div class="row">
    <div class="col-md-6">

      <h2>Login</h2>

      <div
        *ngIf="formError"
        class="alert alert-danger">
        {{ formError }}
      </div>

      <form
        (ngSubmit)="onLoginSubmit()">

        <div class="form-group">
          <label for="name">
            Name
          </label>

          <input
            id="name"
            name="name"
            type="text"
            class="form-control"
            [(ngModel)]="credentials.name">
        </div>

        <div class="form-group">
          <label for="email">
            Email Address
          </label>

          <input
            id="email"
            name="email"
            type="email"
            class="form-control"
            [(ngModel)]="credentials.email">
        </div>

        <div class="form-group">
          <label for="password">
            Password
          </label>

          <input
            id="password"
            name="password"
            type="password"
            class="form-control"
            [(ngModel)]="credentials.password">
        </div>

        <button
          type="submit"
          class="btn btn-primary mt-3">
          Sign In!
        </button>

      </form>
    </div>
  </div>
</div>
